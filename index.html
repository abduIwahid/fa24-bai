<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA24-BAI</title>
    <link rel="icon" href="logo.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo.jpeg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004741">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <img src="logo.jpeg" alt="FA24-BAI Logo" class="app-logo" aria-label="Application Logo">
                    <div class="header-text">
                        <h1>Study Hub</h1>
                        <p class="header-subtitle">Your Learning Companion</p>
                    </div>
                </div>
                <div class="header-right">
                    <button id="adminLoginBtn" class="admin-btn" aria-label="Admin Login">Admin Login</button>
                    <div id="adminWelcome" class="admin-welcome" role="status" aria-live="polite">
                        Welcome Admin, Abdul Wahid!
                    </div>
                </div>
            </div>
        </div>

        <div class="upload-section" id="uploadSection" style="display: none;">
            <h3 class="section-title">Upload Resource</h3>
            <input type="text" id="folderInput" placeholder="Folder (e.g. 5th Semester) - Optional" list="folderOptions"
                style="margin-bottom: 0.5rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px;">
            <datalist id="folderOptions"></datalist>
            <input type="file" id="fileInput"
                accept="application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            <button id="uploadBtn">Upload to GitHub</button>
            <p id="uploadStatus"></p>
        </div>

        <div id="navigationBar"
            style="display: none; align-items: center; gap: 10px; margin-bottom: 1.5rem; background: var(--card-bg); padding: 1rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <button id="backBtn" class="action-btn"
                style="background: #333; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 6px;">&larr;
                Back</button>
            <h2 id="currentPath" style="margin: 0; font-size: 1.2rem; color: var(--text-color);"></h2>
        </div>

        <div class="controls-section" id="controlsSection">
            <input type="text" id="searchInput" placeholder="Search courses, manuals, CDFs...">
            <div class="filters" id="filtersContainer">
                <button class="filter-chip active" data-filter="All">All</button>
                <button class="filter-chip" data-filter="CDF">CDF</button>
                <button class="filter-chip" data-filter="Lab Manual">Lab Manual</button>
                <button class="filter-chip" data-filter="Syllabus">Syllabus</button>
                <button class="filter-chip" data-filter="Lectures">Lectures</button>
                <button class="filter-chip" data-filter="Assignments">Assignments</button>
            </div>
        </div>

        <div id="quickAccessContainer" style="display: none; margin-bottom: 2rem;">
            <h3 class="section-title">Recently Viewed</h3>
            <div class="resources-list" id="quickAccessList"></div>
        </div>

        <div class="courses-grid" id="coursesContainer">
            <p class="loading-text">Loading hub...</p>
        </div>
    </div>

    <!-- AI Assistant Modal -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="aiModalTitle">AI Assistant</h3>
                    <p id="aiModalSubtitle" style="margin:0; font-size:0.8rem; color:#666;"></p>
                </div>
                <button class="close-btn" id="aiCloseBtn" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="ai-quick-actions">
                    <button class="ai-action-btn" data-action="summarize">Summarize</button>
                    <button class="ai-action-btn" data-action="quiz">Generate Quiz</button>
                    <button class="ai-action-btn" data-action="viva">Viva Questions</button>
                </div>
                <div class="chat-container" id="chatContainer">
                    <div class="chat-message ai">Hi! I'm your AI study assistant. Ask me anything about this document,
                        or use the quick actions above.</div>
                </div>
            </div>
            <div class="modal-footer">
                <input type="text" id="aiInput" placeholder="Ask a question..." aria-label="AI input">
                <button id="aiSendBtn" aria-label="Send message">Send</button>
            </div>
        </div>
    </div>

    <!-- Bottom Favicon Navigation Bar -->
    <nav class="favicon-bar" id="faviconBar" aria-label="Quick navigation">
        <a href="#" class="favicon-item" title="Home" onclick="window.scrollToHome(); return false;" aria-label="Go to home">
            <span class="favicon-icon">🏠</span>
            <span class="favicon-label">Home</span>
        </a>
        <a href="#" class="favicon-item" title="Recent" onclick="window.scrollToRecent(); return false;" aria-label="View recent items">
            <span class="favicon-icon">📚</span>
            <span class="favicon-label">Recent</span>
        </a>
        <a href="#" class="favicon-item" title="Search" onclick="window.focusSearch(); return false;" aria-label="Focus search">
            <span class="favicon-icon">🔍</span>
            <span class="favicon-label">Search</span>
        </a>
        <a href="#" class="favicon-item" title="Settings" onclick="window.openSettings(); return false;" aria-label="Open settings">
            <span class="favicon-icon">⚙️</span>
            <span class="favicon-label">Settings</span>
        </a>
    </nav>

    <script src="js/script.js"></script>
</body>

</html>
