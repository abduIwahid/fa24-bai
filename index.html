<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA24 - BAI Documents</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-color: #111827;
            --card-bg: #ffffff;
            --accent: #f3f4f6;
            --hover: #e5e7eb;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.6rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            font-weight: 600;
        }

        .links-grid {
            display: grid;
            gap: 1rem;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent);
            color: var(--text-color);
            text-decoration: none;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }

        a:hover {
            background-color: var(--hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Document Repository</h1>
        <div class="links-grid">
            <a href="PAILM.pdf" target="_blank">📄 View PAILM.pdf</a>
            <a href="OSLM.pdf" target="_blank">📄 View OSLM.pdf</a>
        </div>
    </div>
</body>
</html>
