<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA24-BAI</title>
    <link rel="icon" href="logo.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo.jpeg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004741">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.jpeg" alt="FA24-BAI Logo" class="app-logo">
            <h1>5th Semester Study Hub</h1>
            <button id="adminLoginBtn" class="admin-btn">Admin Login</button>
            <div id="adminWelcome" style="display: none; color: white; font-weight: bold; text-align: center; margin-top: 10px;">Welcome Admin, Abdul Wahid!</div>
        </div>

        <div class="upload-section" id="uploadSection" style="display: none;">
            <h3 class="section-title">Upload Resource</h3>
            <input type="text" id="folderInput" placeholder="Folder (e.g. 5th Semester) - Optional" list="folderOptions" style="margin-bottom: 0.5rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px;">
            <datalist id="folderOptions"></datalist>
            <input type="file" id="fileInput" accept="application/pdf">
            <button id="uploadBtn">Upload to GitHub</button>
            <p id="uploadStatus"></p>
        </div>

        <div class="controls-section">
            <input type="text" id="searchInput" placeholder="Search courses, manuals, CDFs...">
            <div class="filters" id="filtersContainer">
                <button class="filter-chip active" data-filter="All">All</button>
                <button class="filter-chip" data-filter="CDF">CDF</button>
                <button class="filter-chip" data-filter="Lab Manual">Lab Manual</button>
                <button class="filter-chip" data-filter="Syllabus">Syllabus</button>
            </div>
        </div>

        <div id="quickAccessContainer" style="display: none; margin-bottom: 2rem;">
            <h3 class="section-title">Recently Viewed</h3>
            <div class="resources-list" id="quickAccessList"></div>
        </div>

        <div class="courses-grid" id="coursesContainer">
            <p class="loading-text">Loading hub...</p>
        </div>
    </div>

    <!-- AI Assistant Modal -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="aiModalTitle">AI Assistant</h3>
                    <p id="aiModalSubtitle" style="margin:0; font-size:0.8rem; color:#666;"></p>
                </div>
                <button class="close-btn" id="aiCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="ai-quick-actions">
                    <button class="ai-action-btn" data-action="summarize">Summarize</button>
                    <button class="ai-action-btn" data-action="quiz">Generate Quiz</button>
                    <button class="ai-action-btn" data-action="viva">Viva Questions</button>
                </div>
                <div class="chat-container" id="chatContainer">
                    <div class="chat-message ai">Hi! I'm your AI study assistant. Ask me anything about this document, or use the quick actions above.</div>
                </div>
            </div>
            <div class="modal-footer">
                <input type="text" id="aiInput" placeholder="Ask a question...">
                <button id="aiSendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
